{% load brand_format %}<select name="category" aria-label="업종" class="category-select">
    <option value="전체">전체 업종</option>
    {% for group in category_groups %}
        <optgroup label="{{ group.icon }} {{ group.name }}">
            {% for c in group.categories %}
                <option value="{{ c.name }}" {% if c.name == selected %}selected{% endif %}>{{ c.name|category_icon }} {{ c.name }} ({{ c.count }})</option>
            {% endfor %}
        </optgroup>
    {% endfor %}
</select>
