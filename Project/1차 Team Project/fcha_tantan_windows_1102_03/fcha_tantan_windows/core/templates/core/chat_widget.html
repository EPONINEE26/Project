<aside class="chat-widget" data-chat-widget><button type="button" class="chat-launcher" aria-expanded="false" aria-controls="site-chat" aria-label="탄탄 도우미 열기"><span class="assistant-icon" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 32 32" fill="none"><path d="M7 8.5h14a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-7l-6 4v-4a4 4 0 0 1-4-4v-8a4 4 0 0 1 3-4Z" fill="white" fill-opacity=".96"/><path d="m25 2 1.3 3.7L30 7l-3.7 1.3L25 12l-1.3-3.7L20 7l3.7-1.3L25 2Z" fill="#BFEAFF"/><circle cx="11" cy="16" r="1.5" fill="#367CE1"/><circle cx="19" cy="16" r="1.5" fill="#367CE1"/><path d="M12 20c1.8 1.5 4.2 1.5 6 0" stroke="#367CE1" stroke-width="1.4" stroke-linecap="round"/></svg></span><span class="assistant-copy"><small>궁금한 순간, 가볍게</small><b>탄탄 도우미</b></span><svg class="assistant-arrow" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 12 12 4M4 4h8v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><section id="site-chat" class="chat-panel" hidden role="dialog" aria-label="사이트 안내 도우미"><header><div><b>탄탄 도우미</b><small>사이트 정보 검색 · 무료</small></div><button type="button" class="chat-close" aria-label="챗봇 닫기">×</button></header><div class="chat-messages" role="log" aria-live="polite"><div class="chat-message bot">어떤 기능을 찾고 계세요? 사이트 사용법과 등록된 브랜드 정보를 찾아드릴게요.</div></div><div class="chat-suggestions"><button type="button">브랜드 비교</button><button type="button">점주 인증</button><button type="button">회수 계산</button></div><form class="chat-form" action="{% url 'core:chat' %}" method="post">{% csrf_token %}<label class="sr-only" for="chat-question">질문 입력</label><input id="chat-question" name="question" maxlength="500" placeholder="궁금한 내용을 입력하세요" required autocomplete="off"><button type="submit" aria-label="질문 보내기">↑</button></form><p class="chat-footnote">등록된 도움말·사이트 데이터에서 답을 찾습니다.</p></section></aside>
