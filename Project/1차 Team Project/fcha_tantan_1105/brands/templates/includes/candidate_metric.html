{% load brand_format %}<div class="candidate-metric">
    <span class="candidate-metric-label">{{ label }}</span>
    {% if metric %}
        <div class="peer-bar"><span>이 브랜드</span><div class="peer-track"><i class="mine" style="width:{{ metric.mine_width }}%"></i></div><b>{{ metric.mine|number }}{{ unit }}</b></div>
        <div class="peer-bar"><span>업계 평균</span><div class="peer-track"><i class="average" style="width:{{ metric.average_width }}%"></i></div><b>{{ metric.average|number }}{{ unit }}</b></div>
    {% else %}
        <p class="candidate-metric-empty">공시 자료 없음</p>
    {% endif %}
</div>
