{% extends 'base.html' %}
{% block content %}
    <div class="container narrow-page">
        <div class="page-header">
            <a class="back-link" href="{% url 'core:help' %}">← 고객센터</a>
            <h1>1:1 문의하기</h1>
            <p>문의 내용은 본인과 관리자만 볼 수 있습니다. 비밀번호나 주민등록번호는 입력하지 마세요.</p>
        </div>
        <section class="panel">
            <form method="post" class="form-stack">
                {% csrf_token %}
                {% include 'includes/form_fields.html' %}
                <button class="button">문의 접수</button>
            </form>
        </section>
    </div>
{% endblock %}
