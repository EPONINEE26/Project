<link rel="stylesheet" href="{% static 'css/chat_alert.css' %}?v=20261105-2">
<div class="chat-alert" data-chat-alert data-summary-url="{% url 'market:chat_summary' %}" hidden>
    <section class="chat-alert-panel" id="chat-alert-panel" aria-label="최근 대화" hidden>
        <header><div><b>문의 채팅</b><small data-chat-alert-people aria-live="polite"></small></div><a href="{% url 'market:chat_list' %}">전체 대화 보기 →</a></header>

    </button>
</div>
<script src="{% static 'js/chat_alert.js' %}?v=20261105-2" defer></script>
