{% extends 'base.html' %}{% block content %}<div class="container reading-page"><div class="page-header"><h1>내 문의 내역</h1><a class="button outline" href="{% url 'core:ticket_new' %}">새 문의</a></div><section class="panel">{% for ticket in tickets %}<a class="ticket-row" href="{% url 'core:ticket_detail' ticket.pk %}"><span class="status-tag">{{ ticket.get_status_display }}</span><b data-no-translate>{{ ticket.title }}</b><time>{{ ticket.created_at|date:'Y.m.d' }}</time></a>{% empty %}<p>등록된 문의가 없습니다.</p>{% endfor %}</section></div>{% endblock %}
