{% if field.is_hidden %}
    {{ field }}
{% else %}
    <div class="form-field{% if field.field.widget.input_type == 'checkbox' %} check-field{% endif %}{% if field.field.widget.input_type == 'radio' %} radio-field{% endif %}">
        {% if field.field.widget.input_type == 'checkbox' %}
            <label class="check-label">
                {{ field }}
                <span>{{ field.label }}</span>
            </label>
        {% else %}
            <label for="{{ field.id_for_label }}">
                {{ field.label }}
                {% if not field.field.required and field.name not in required_names %}
                    <span class="optional-label">선택</span>
                {% endif %}
            </label>
            {{ field }}
        {% endif %}
        {{ field.errors }}
        {% if field.help_text %}
            <div class="help-text">
                {{ field.help_text|safe }}
            </div>
        {% endif %}
    </div>
{% endif %}
